<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Evaluación Técnica: Refrigeración Termoeléctrica en HPC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fff0e6 0%, #e0f0fa 50%, #f5e0ff 100%);
            font-family: 'Segoe UI', 'Roboto', 'Poppins', system-ui, sans-serif;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-wrapper {
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.25);
            padding: 1.8rem;
            transition: all 0.2s;
        }

        .header {
            text-align: center;
            margin-bottom: 1.2rem;
            border-bottom: 4px solid #ff8c42;
            padding-bottom: 0.7rem;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #1e6f9f, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.2px;
        }

        .sub {
            color: #e67e22;
            font-size: 0.85rem;
            margin-top: 0.2rem;
            font-weight: 600;
        }

        .progress-area {
            background: #e6e0f0;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #1a4a6e;
            font-weight: 700;
        }

        .question-counter {
            font-weight: 800;
            background: #ffcc88;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            color: #5a3a1a;
        }

        .score-badge {
            background: #88ccaa;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 700;
            color: #1a4a2e;
        }

        .question-card {
            background: #ffffff;
            border-radius: 1.5rem;
            padding: 1.3rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border-left: 8px solid #ff8c42;
            border-right: 1px solid #f0e0d0;
        }

        .question-text {
            font-size: 1.08rem;
            font-weight: 800;
            color: #2c3e66;
            margin-bottom: 1.2rem;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            cursor: pointer;
            padding: 0.6rem 0.8rem;
            border-radius: 1rem;
            background: #fefaf5;
            border: 2px solid #e0d0c0;
            transition: all 0.15s;
        }

        .option:hover {
            background: #fff4e6;
            border-color: #ffaa66;
            transform: scale(1.01);
        }

        input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid #e67e22;
            border-radius: 50%;
            margin-top: 0.1rem;
            cursor: pointer;
            background: white;
            flex-shrink: 0;
        }

        input[type="radio"]:checked {
            background-color: #e67e22;
            border-color: #e67e22;
            box-shadow: inset 0 0 0 3px white;
        }

        .option label {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.4;
            cursor: pointer;
            color: #2c3e66;
            font-weight: 600;
        }

        .feedback {
            margin-top: 0.8rem;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            background: #fef7e8;
            border-left: 5px solid;
            line-height: 1.4;
            color: #2c3e50;
        }

        .feedback.correct {
            border-left-color: #44aa66;
            background: #e0ffe8;
        }

        .feedback.incorrect {
            border-left-color: #ff6666;
            background: #ffe6e6;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            border: none;
            background: #ddd0c0;
            color: #4a3a2a;
            font-weight: 800;
            padding: 0.6rem 1.3rem;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: #3a86ff;
            color: white;
        }

        .btn-primary:hover {
            background: #2a6ad0;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #e67e22;
            color: white;
        }

        .btn-secondary:hover {
            background: #d46a10;
        }

        .btn-reset {
            background: #cc6644;
            color: white;
        }

        .btn-reset:hover {
            background: #aa4422;
        }

        .btn-success {
            background: #44aa66;
            color: white;
        }

        .btn-success:hover {
            background: #338855;
        }

        .results-area {
            margin-top: 1.5rem;
            background: #fff2e0;
            border-radius: 1.2rem;
            padding: 1rem;
            border: 2px solid #ffaa33;
            display: none;
        }

        .results-area h3 {
            color: #cc5500;
            margin-bottom: 0.5rem;
        }

        .result-summary {
            font-size: 1rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
            color: #1f4a2e;
        }

        .result-detail {
            max-height: 260px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .result-item {
            padding: 0.4rem;
            border-bottom: 1px solid #ffd9a0;
            display: flex;
            gap: 0.5rem;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 1.2rem;
            color: #aa8855;
        }

        @media (max-width: 600px) {
            .quiz-wrapper {
                padding: 1rem;
            }
            .question-text {
                font-size: 0.98rem;
            }
            .option label {
                font-size: 0.88rem;
            }
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <div class="header">
        <h1>❄️ Refrigeración Termoeléctrica en HPC</h1>
        <div class="sub">Módulos Peltier, control térmico, eficiencia y arquitecturas avanzadas</div>
    </div>

    <div class="progress-area">
        <span class="question-counter" id="questionCounter">Pregunta 1 / 20</span>
        <span class="score-badge" id="liveScore">✅ Aciertos: 0</span>
    </div>

    <div id="questionContainer"></div>

    <div class="nav-buttons">
        <button id="prevBtn" class="btn btn-secondary">◀ Anterior</button>
        <button id="nextBtn" class="btn btn-primary">Siguiente ▶</button>
        <button id="resetBtn" class="btn btn-reset">⟳ Reiniciar</button>
        <button id="finalScoreBtn" class="btn btn-success">📊 Ver total</button>
    </div>

    <div id="resultsPanel" class="results-area"></div>
    <footer>📌 Selecciona una opción → retroalimentación inmediata. Al finalizar, revisa tu puntuación.</footer>
</div>

<script>
    // ==================== DATOS DEL CUESTIONARIO ====================
    const questionsData = [
        { text: "Un ingeniero observa que un ASIC de 700W presenta hotspots que superan en 30°C la temperatura media del die. ¿Por qué un sistema de refrigeración líquida directa (DLC) convencional no es suficiente para este escenario específico?",
          options: ["Porque el fluido refrigerante tiene una capacidad calorífica insuficiente para el silicio.", "Porque el DLC es un sistema reactivo que no puede enfriar por debajo de la temperatura del fluido de retorno.", "Porque la viscosidad del refrigerante impide la transferencia de calor en nodos de 3 nm.", "Porque los coldplates de cobre presentan una resistencia térmica de interfaz insuperable."],
          correct: "b",
          explanation: "Correcta (b): El DLC no puede enfriar por debajo de la temperatura del refrigerante, lo que limita su eficacia ante hotspots que requieren temperaturas específicas controladas activamente."
        },
        { text: "Para optimizar el Coeficiente de Rendimiento (COP) en un módulo Peltier basado en $Bi_2Te_3$, ¿en qué rango de fracción de corriente ($I/I_{max}$) debería operarse el sistema?",
          options: ["Entre 0,8 y 1,0 para maximizar la capacidad de bombeo de calor ($Q_{max}$).", "Cerca de 0,1 para minimizar el efecto Joule parásito.", "Entre 0,3 y 0,6 para equilibrar el calor extraído frente a la energía eléctrica consumida.", "Exactamente en 1,0 para alcanzar el $\\Delta T_{max}$ especificado por el fabricante."],
          correct: "c",
          explanation: "Correcta (c): La optimización del COP se logra operando el TEC en una fracción de corriente típicamente entre 0,3 y 0,6, maximizando la relación $Q_c / (Q_c + P)$."
        },
        { text: "En una carga de trabajo con ráfagas computacionales (burst) impredecibles, ¿cuál es la ventaja crítica de un TEC frente a la refrigeración por inmersión?",
          options: ["La mayor conductividad térmica de los semiconductores tipo P y N.", "El tiempo de respuesta en milisegundos que permite compensar gradientes instantáneos.", "La capacidad de eliminar totalmente el ruido acústico en el rack.", "La reducción del PUE global del centro de datos mediante disipación pasiva."],
          correct: "b",
          explanation: "Correcta (b): Los TEC tienen tiempos de respuesta de milisegundos, críticos para cargas con burst térmico, frente a segundos/minutos de sistemas líquidos."
        },
        { text: "¿Qué parámetro de diseño es fundamental para evitar la degradación por electromigración en aceleradores de IA de última generación?",
          options: ["El uso de ventiladores de alto caudal para reducir la temperatura ambiente.", "El control preciso de la temperatura de unión mediante lazo PID para evitar picos térmicos.", "El incremento de la tensión de umbral en los transistores del die.", "La sustitución de interconexiones de cobre por fibras ópticas internas."],
          correct: "b",
          explanation: "Correcta (b): Las altas temperaturas aceleran la electromigración; controladores PID en TECs mantienen estabilidad térmica mitigando el deterioro."
        },
        { text: "Al diseñar el driver de potencia para un TEC, se recomienda una salida PWM de alta frecuencia (>50 kHz). ¿Cuál es el objetivo técnico principal de esta especificación?",
          options: ["Aumentar la Figura de Mérito (ZT) de los materiales semiconductores.", "Minimizar el ripple de corriente para reducir el ruido electromagnético y el estrés térmico en el módulo.", "Invertir la polaridad del módulo instantáneamente para funciones de calefacción.", "Reducir el consumo de energía eléctrica del convertidor AC-DC principal."],
          correct: "b",
          explanation: "Correcta (b): PWM de alta frecuencia minimiza el ripple de corriente, mejorando eficiencia y reduciendo interferencias electromagnéticas."
        },
        { text: "¿Cuál es la principal restricción operativa de la refrigeración por inmersión en comparación con la integración de TECs de Nivel 1?",
          options: ["La inmersión no permite el control térmico a nivel de componente individual.", "La inmersión es incompatible con GPUs de arquitectura Blackwell.", "Los TECs requieren fluidos dieléctricos para funcionar, mientras que la inmersión no.", "El coste de mantenimiento de un sistema sólido es mayor que el de uno líquido."],
          correct: "a",
          explanation: "Correcta (a): La inmersión carece de control térmico a nivel de componente individual, algo que la tecnología Peltier sí ofrece."
        },
        { text: "En un sistema de computación cuántica, ¿qué rol desempeñan los módulos Peltier en cascada (multi-stage)?",
          options: ["Actúan como el sistema de refrigeración principal para alcanzar el cero absoluto.", "Funcionan como primera etapa para llevar componentes de temperatura ambiente a rangos sub-cero (e.g., -40°C).", "Eliminan la necesidad de sistemas criogénicos de dilución mediante el efecto Seebeck.", "Estabilizan la tensión de alimentación de los qubits superconductores."],
          correct: "b",
          explanation: "Correcta (b): Los TEC en cascada se usan como etapa inicial de enfriamiento para reducir la carga sobre sistemas criogénicos más complejos."
        },
        { text: "Si un diseño térmico de Nivel 4 (TEC + bomba de calor) se implementa incorrectamente y la cara caliente no evacua el calor de manera eficiente, ¿qué fenómeno ocurrirá?",
          options: ["El ΔT entre caras aumentará indefinidamente hasta el punto de fusión del silicio.", "El calor generado por el propio TEC ($P_{eléctrica}$) se sumará al del chip, sobrecalentando la unión.", "El coeficiente Seebeck se volverá negativo, invirtiendo el flujo de calor automáticamente.", "El sistema entrará en un estado de superconducción térmica pasiva."],
          correct: "b",
          explanation: "Correcta (b): El subsistema de disipación debe evacuar tanto Qc como P_eléctrica; de lo contrario el calor acumulado sobrecalienta la unión."
        },
        { text: "¿Por qué la integración de TECs 'embebidos directamente en el encapsulado' (Nivel 1) ofrece el mejor rendimiento térmico?",
          options: ["Porque utiliza materiales cerámicos de mayor conductividad que el cobre.", "Porque minimiza la resistencia térmica de interfaz ($R_{th,interface}$) al estar en máxima proximidad al die.", "Porque elimina la necesidad de un controlador PID externo.", "Porque permite que el chip opere sin consumo de energía eléctrica externa."],
          correct: "b",
          explanation: "Correcta (b): La arquitectura de Nivel 1 minimiza la resistencia térmica de interfaz al colocar el TEC lo más cerca posible del die."
        },
        { text: "¿Cuál es el beneficio directo de lograr un enfriamiento sub-ambiente en semiconductores según el documento?",
          options: ["Incremento del ruido acústico para facilitar el diagnóstico de fallos.", "Reducción de la tensión de umbral y posibilidad de overclocking térmicamente estable.", "Aumento automático del MTBF por encima de las 500.000 horas.", "Eliminación total de la necesidad de materiales de interfaz térmica (TIM)."],
          correct: "b",
          explanation: "Correcta (b): El enfriamiento sub-ambiente reduce tensiones de umbral y permite overclocking estable."
        },
        { text: "Al diagnosticar un sistema que sufre throttling térmico a pesar de tener un TEC, se detecta que el sensor de temperatura tiene una tasa de muestreo de 10 Hz. ¿Por qué esto es un error de diseño?",
          options: ["Porque los termopares tipo K solo funcionan a frecuencias superiores a 1 kHz.", "Porque se requiere una tasa de muestreo de 1 kHz para igualar la respuesta rápida del TEC ante burst térmicos.", "Porque a 10 Hz el algoritmo PID consume demasiada memoria en la FPGA.", "Porque el ripple de corriente se vuelve infinito a bajas frecuencias de muestreo."],
          correct: "b",
          explanation: "Correcta (b): El sistema necesita alta tasa de muestreo (~1 kHz) para igualar la respuesta rápida del TEC y evitar throttling."
        },
        { text: "En un escenario de Edge Computing con temperaturas ambientales de +70°C, ¿cómo ayuda el control bidireccional del TEC?",
          options: ["Permite usar el TEC como generador de energía para alimentar el sensor de temperatura.", "Permite enfriar activamente el acelerador y mantener una latencia de inferencia constante.", "Evita que el aire caliente del entorno entre en contacto con el rack.", "Reduce la humedad relativa dentro del encapsulado del ASIC."],
          correct: "b",
          explanation: "Correcta (b): El control activo compensa variaciones ambientales extremas, garantizando estabilidad operativa en el edge."
        },
        { text: "Un ASIC de IA tiene un perfil térmico no uniforme. ¿Qué arquitectura de integración es la más adecuada para gestionar hotspots sub-die específicos?",
          options: ["Refrigeración por aire con heatsinks de aluminio de gran tamaño.", "Matrices de múltiples TECs pequeños (Nivel 3) posicionados sobre los hotspots.", "Inmersión en líquido monofásico para uniformar la temperatura global.", "Aumento de la frecuencia de reloj en las zonas frías del die."],
          correct: "b",
          explanation: "Correcta (b): Múltiples TECs (Nivel 3) permiten gestión granular y localizada del calor en superficies no uniformes."
        },
        { text: "¿Cuál es el impacto de la Figura de Mérito (ZT) en el diseño de futuros sistemas de refrigeración?",
          options: ["Un mayor ZT indica que el material es más pesado y difícil de integrar.", "Un aumento en ZT permite duplicar la eficiencia de enfriamiento y mejorar el COP.", "ZT es un parámetro puramente teórico que no afecta al rendimiento real.", "Cuanto mayor es el ZT, mayor es el riesgo de fugas de refrigerante."],
          correct: "b",
          explanation: "Correcta (b): El avance en ZT (de 1,2 a >2,0) mejora drásticamente la eficiencia de los módulos termoeléctricos."
        },
        { text: "Un sistema híbrido utiliza un TEC acoplado a un coldplate de cobre (Nivel 2). ¿Qué función cumple el coldplate en este diseño?",
          options: ["Actúa como la cara fría que absorbe el calor del silicio.", "Sirve para evacuar el calor de la cara caliente del TEC hacia un sistema secundario.", "Sustituye al material semiconductor tipo N para reducir costes.", "Genera la corriente eléctrica necesaria para alimentar el módulo Peltier."],
          correct: "b",
          explanation: "Correcta (b): El coldplate evacua el calor acumulado en la cara caliente del TEC hacia un sistema secundario."
        },
        { text: "¿Qué problema de la refrigeración por aire convencional se vuelve 'inaceptable' al superar los 20-30 kW por rack?",
          options: ["El consumo de agua destilada.", "El ruido acústico y la degradación del PUE.", "La falta de conductores de cobre en los ventiladores.", "La imposibilidad de usar filtros de aire HEPA."],
          correct: "b",
          explanation: "Correcta (b): A altas densidades, el ruido y la ineficiencia energética (PUE) de los sistemas por aire llegan a límites inaceptables."
        },
        { text: "En el contexto del TCO (Total Cost of Ownership), ¿cómo se justifica el alto consumo eléctrico de un módulo Peltier (COP 0,3-0,7)?",
          options: ["Porque el TEC genera electricidad sobrante que se devuelve a la red.", "Porque evitar un fallo prematuro o una pérdida de rendimiento del 15-30% compensa el coste energético.", "Porque el gobierno ofrece subsidios para tecnologías de estado sólido.", "Porque los TECs eliminan la necesidad de pagar licencias de software de gestión térmica."],
          correct: "b",
          explanation: "Correcta (b): El coste operativo extra es despreciable frente a las pérdidas por throttling o fallo del hardware."
        },
        { text: "¿Qué ventaja ofrece el estado sólido total de los TECs en comparación con los sistemas DLC?",
          options: ["Capacidad de enfriar mayores superficies por centímetro cuadrado.", "Ausencia de partes móviles y de riesgo de fugas de fluidos.", "Menor coste inicial de adquisición de materiales.", "Posibilidad de funcionar sin necesidad de alimentación DC."],
          correct: "b",
          explanation: "Correcta (b): Al no tener fluidos ni partes móviles, se eliminan riesgos de mantenimiento y fallos mecánicos."
        },
        { text: "Para un sistema de entrenamiento de modelos de IA a gran escala, ¿qué beneficio reporta mantener la $T_{junction}$ constante?",
          options: ["Permite reducir el tamaño de las fuentes de alimentación del servidor.", "Elimina el throttling térmico que degrada el rendimiento en sesiones prolongadas.", "Cambia la arquitectura de la red neuronal de Transformer a CNN de forma automática.", "Reduce la latencia de red entre los nodos del clúster."],
          correct: "b",
          explanation: "Correcta (b): Mantener temperatura constante evita el throttling, maximizando el rendimiento computacional neto."
        },
        { text: "Al realizar un 'Retrofit' de tecnología Peltier sobre hardware existente, ¿cuál es la principal desventaja mencionada?",
          options: ["El sistema se vuelve demasiado ligero y pierde estabilidad mecánica.", "El coste es de 3 a 5 veces superior al de una integración nativa en el diseño original.", "Los TECs no pueden instalarse si el hardware ya ha sido encendido una vez.", "Se requiere cambiar todo el sistema operativo para reconocer el módulo Peltier."],
          correct: "b",
          explanation: "Correcta (b): La integración nativa es mucho más eficiente en costes que adaptar la tecnología a sistemas ya diseñados (retrofit)."
        }
    ];

    let userAnswers = new Array(20).fill(null);
    let currentIndex = 0;

    const questionContainer = document.getElementById('questionContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const finalScoreBtn = document.getElementById('finalScoreBtn');
    const questionCounterSpan = document.getElementById('questionCounter');
    const liveScoreSpan = document.getElementById('liveScore');
    const resultsPanel = document.getElementById('resultsPanel');

    function updateLiveScore() {
        let correctCount = 0;
        for (let i = 0; i < userAnswers.length; i++) {
            if (userAnswers[i] && userAnswers[i] === questionsData[i].correct) correctCount++;
        }
        liveScoreSpan.textContent = `✅ Aciertos: ${correctCount} / 20`;
        return correctCount;
    }

    function saveAnswer(selectedLetter) {
        userAnswers[currentIndex] = selectedLetter;
        updateLiveScore();
        renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
        const q = questionsData[currentIndex];
        const selected = userAnswers[currentIndex];
        const letters = ['a', 'b', 'c', 'd'];
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            const letter = letters[idx];
            const isChecked = (selected === letter);
            optionsHtml += `
                <div class="option" data-letter="${letter}">
                    <input type="radio" name="question" value="${letter}" id="opt_${letter}" ${isChecked ? 'checked' : ''}>
                    <label for="opt_${letter}"><strong>${letter.toUpperCase()})</strong> ${opt}</label>
                </div>
            `;
        });

        let feedbackHtml = '';
        if (selected) {
            const isCorrect = (selected === q.correct);
            const correctLetter = q.correct;
            const correctText = q.options[letters.indexOf(correctLetter)];
            const explanation = q.explanation;
            if (isCorrect) {
                feedbackHtml = `<div class="feedback correct">✅ <strong>¡Correcto!</strong> ${explanation}</div>`;
            } else {
                feedbackHtml = `<div class="feedback incorrect">❌ <strong>Incorrecto.</strong> La respuesta correcta es ${correctLetter.toUpperCase()}) ${correctText}.<br>${explanation}</div>`;
            }
        } else {
            feedbackHtml = `<div class="feedback" style="border-left-color:#ffcc88; background:#fff5e6;">⚡ Selecciona una opción para ver la retroalimentación.</div>`;
        }

        const html = `
            <div class="question-card">
                <div class="question-text">${q.text}</div>
                <div class="options" id="optionsContainer">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
            </div>
        `;
        questionContainer.innerHTML = html;

        // Event listeners
        const optionDivs = document.querySelectorAll('.option');
        optionDivs.forEach(div => {
            const radio = div.querySelector('input[type="radio"]');
            const letter = div.getAttribute('data-letter');
            if (radio) {
                radio.addEventListener('change', () => {
                    if (radio.checked) saveAnswer(letter);
                });
            }
            div.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    const radioInside = div.querySelector('input');
                    if (radioInside && !radioInside.checked) {
                        radioInside.checked = true;
                        saveAnswer(letter);
                    }
                }
            });
        });

        questionCounterSpan.textContent = `Pregunta ${currentIndex+1} / 20`;
    }

    function showFinalResults() {
        let correctCount = 0;
        let detailsHtml = '';
        for (let i = 0; i < questionsData.length; i++) {
            const q = questionsData[i];
            const userAns = userAnswers[i];
            const isCorrect = (userAns === q.correct);
            if (isCorrect) correctCount++;
            const statusIcon = isCorrect ? '✅' : '❌';
            const userShow = userAns ? userAns.toUpperCase() : '—';
            const correctShow = q.correct.toUpperCase();
            detailsHtml += `
                <div class="result-item">
                    <span style="min-width: 30px;">${statusIcon}</span>
                    <span><strong>Pregunta ${i+1}</strong> (Tu respuesta: ${userShow} / Correcta: ${correctShow})</span>
                </div>
            `;
        }
        const percent = Math.round((correctCount / 20) * 100);
        resultsPanel.innerHTML = `
            <h3>📊 Resultado final</h3>
            <div class="result-summary">🎯 Aciertos: ${correctCount} de 20 (${percent}%)</div>
            <div class="result-detail">${detailsHtml}</div>
            <button id="closeResultsBtn" class="btn btn-secondary" style="margin-top: 10px; width:100%;">✖ Cerrar resumen</button>
        `;
        resultsPanel.style.display = 'block';
        document.getElementById('closeResultsBtn')?.addEventListener('click', () => {
            resultsPanel.style.display = 'none';
        });
        alert(`📊 Cuestionario completado.\nAciertos: ${correctCount} de 20 (${percent}%)\nRevisa el resumen detallado en pantalla.`);
    }

    function nextQuestion() {
        if (currentIndex < 19) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                if (confirm(`Aún tienes ${unanswered} pregunta(s) sin responder. ¿Deseas finalizar de todas formas? Las no respondidas se contarán como incorrectas.`)) {
                    showFinalResults();
                }
            } else {
                showFinalResults();
            }
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
        } else {
            alert("Ya estás en la primera pregunta.");
        }
    }

    function resetQuiz() {
        if (confirm("¿Reiniciar todo el cuestionario? Se perderán todas las respuestas.")) {
            userAnswers = new Array(20).fill(null);
            currentIndex = 0;
            resultsPanel.style.display = 'none';
            updateLiveScore();
            renderCurrentQuestion();
        }
    }

    prevBtn.addEventListener('click', prevQuestion);
    nextBtn.addEventListener('click', nextQuestion);
    resetBtn.addEventListener('click', resetQuiz);
    finalScoreBtn.addEventListener('click', showFinalResults);

    renderCurrentQuestion();
    updateLiveScore();
</script>
</body>
</html>
